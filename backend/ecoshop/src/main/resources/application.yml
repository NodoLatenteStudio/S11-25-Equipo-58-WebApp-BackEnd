spring:
  application:
    name: ecoshop
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Prioridad: SPRING_DATASOURCE_URL > DB_URL > valor por defecto
    # Para Internal URL (servicios en la misma región): hostname sin dominio, puerto 5432
    # Para External URL (desde fuera): hostname.oregon-postgres.render.com, puerto 5432
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://dpg-d4n13dq4d50c7391kvvg-a.oregon-postgres.render.com:5432/ecoshop_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:ecoshop_db_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:JFGjiBQrO7T9vYhD5xqE0L93UshwBGoz}}
    driver-class-name: org.postgresql.Driver
    # Configuración del pool de conexiones HikariCP
    hikari:
      connection-timeout: 30000  # 30 segundos
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000  # 10 minutos
      max-lifetime: 1800000  # 30 minutos
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect  # Necesario si la conexión falla al inicio
        format_sql: true
    open-in-view: false
  # Configuración de Spring Security OAuth2 Resource Server (JWT)
  # Spring obtendrá automáticamente las claves públicas desde: {issuer-uri}/.well-known/jwks.json
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER:}  # Debe coincidir exactamente con el issuer del token JWT

server:
  port: ${PORT:${SERVER_PORT:8080}}  # Render usa PORT, local usa SERVER_PORT
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.ecoshop: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.springframework.boot.autoconfigure.jdbc: DEBUG  # Para debug de conexión DB
    com.zaxxer.hikari: DEBUG  # Para debug del pool de conexiones
    org.postgresql: DEBUG  # Para debug del driver de PostgreSQL

# Configuración de Clerk
# IMPORTANTE: Configura estas propiedades como variables de entorno en producción
# Nunca commitees las claves secretas en el repositorio
clerk:
  secret-key: ${CLERK_SECRET_KEY:}  # sk_test_xxxxx o sk_live_xxxxx
  publishable-key: ${CLERK_PUBLISHABLE_KEY:}  # pk_test_xxxxx o pk_live_xxxxx
  webhook-secret: ${CLERK_WEBHOOK_SECRET:}  # whsec_xxxxx
  issuer: ${CLERK_ISSUER:}  # https://your-clerk-instance.clerk.accounts.dev
  api-url: ${CLERK_API_URL:https://api.clerk.com}  # Sin /v1 aquí - se añade según necesidad
