databases:
  # Base de datos PostgreSQL
  - name: ecoshop-db
    plan: free
    region: oregon

services:
  # Servicio Web - Backend Spring Boot
  - type: web
    name: ecoshop-backend
    env: docker          
    region: oregon
    plan: free
    dockerfilePath: ./backend/ecoshop/Dockerfile   
    dockerContext: ./backend/ecoshop               
    healthCheckPath: /api/v1/health                
    envVars:
      # Perfil de Spring para producción
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Base de datos - Render inyecta estos datos desde 'ecoshop-db'
      - key: DB_URL
        fromDatabase:
          name: ecoshop-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: ecoshop-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecoshop-db
          property: password
      # Configuración de JPA para producción
      - key: JPA_DDL_AUTO
        value: update
      - key: JPA_SHOW_SQL
        value: false
      # Configuración de logging
      - key: LOG_LEVEL
        value: INFO
      - key: SECURITY_LOG_LEVEL
        value: WARN
