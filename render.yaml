services:
  # Servicio Web - Backend Spring Boot
  - type: web
    name: ecoshop-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/ecoshop/Dockerfile
    dockerContext: ./backend/ecoshop
    healthCheckPath: /api/v1/health
    envVars:
      # Perfil de Spring para producción
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Base de datos - Se conectará automáticamente a la base de datos PostgreSQL
      # Render proporciona connectionString que ya incluye la URL completa en formato JDBC
      - key: DB_URL
        fromDatabase:
          name: ecoshop-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: ecoshop-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecoshop-db
          property: password
      # Configuración de JPA para producción
      - key: JPA_DDL_AUTO
        value: update
      - key: JPA_SHOW_SQL
        value: false
      # Configuración de logging
      - key: LOG_LEVEL
        value: INFO
      - key: SECURITY_LOG_LEVEL
        value: WARN

